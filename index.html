<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff9f5" />
    <meta name="description" content="Chat screenshot များကိုကြည့်ရှုနိုင်သည့် photo archive။" />
    <meta property="og:image" content="https://daily-wage-app.github.io/memory-chat-hub/assets/memories-us.jpg" />
    <title>Memories & Us — Chat Archive</title>
    <link rel="icon" type="image/jpeg" href="assets/memories-us.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=header-7" />
    <script src="script.js?v=photos-8" defer></script>
  </head>
  <body>
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Memories & Us — ပင်မစာမျက်နှာ">
          <img class="brand-logo" src="assets/memories-us.jpg" alt="Memories & Us" />
        </a>
        <nav class="nav" aria-label="အဓိကလမ်းညွှန်">
          <a href="#home">ပင်မ</a>
          <a href="#gallery">မှတ်တမ်းများ</a>
        </nav>
      </header>

      <main id="home">
        <section class="hero-banner" aria-label="Memories & Us">
          <img class="masthead-image" src="assets/memories-us.jpg" alt="Memories & Us banner" fetchpriority="high" />
        </section>

        <section class="overview" aria-label="မှတ်တမ်းအကျဉ်း">
          <div class="overview-item"><span class="overview-icon">▤</span><span class="overview-label">မှတ်တမ်း</span><strong id="momentCount">10</strong></div>
          <span class="overview-divider" aria-hidden="true"></span>
          <div class="overview-item"><span class="overview-icon">▧</span><span class="overview-label">ပုံများ</span><strong id="photoCount">10</strong></div>
        </section>

        <section class="gallery-section" id="gallery" aria-labelledby="gallery-heading">
          <div class="gallery-heading-row">
            <div class="section-heading">
              <h2 id="gallery-heading">Chat screenshot <em>များ</em></h2>
            </div>
          </div>
          <div id="memoryGrid" class="memory-grid" aria-live="polite"></div>
        </section>
      </main>

      <footer class="footer"><div class="footer-rule"><span>▤</span></div><p><a class="footer-contact" href="https://daily-y-app.github.io/Apk-download" target="_blank" rel="noopener noreferrer">Contect</a></p><a href="#home">အပေါ်သို့ ↑</a></footer>
    </div>

    <dialog id="lightbox" class="lightbox" aria-label="ပုံကို အပြည့်ကြည့်ရန်"><button id="lightboxClose" class="lightbox-close" type="button" aria-label="ပိတ်ရန်">×</button><img id="lightboxImage" alt="မှတ်တမ်းပုံ အပြည့်အစုံ" /><p id="lightboxCaption"></p></dialog>
  </body>
</html>
